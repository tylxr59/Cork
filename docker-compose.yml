services:
  cork:
    image: ghcr.io/tylxr59/cork:latest
    # build: .   # uncomment to build from source instead
    container_name: cork
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Named volume: Docker handles permissions. To use a host folder instead,
      # e.g. ./data:/data, first run: mkdir data && sudo chown 65532:65532 data
      - cork-data:/data
    environment:
      # Set to true when running behind a reverse proxy (Caddy, Traefik, nginx…)
      CORK_TRUST_PROXY: "false"
      # Optional: create an admin on first start instead of using the setup page
      # CORK_ADMIN_USERNAME: admin
      # CORK_ADMIN_PASSWORD: change-me-please

volumes:
  cork-data:
